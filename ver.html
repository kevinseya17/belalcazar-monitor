<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprobante de Egreso - Belalcázar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #eef2f5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header {
      background: #1e3a8a;
      color: white;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 10;
    }
    .info { display: flex; flex-direction: column; }
    .title { font-size: 16px; font-weight: bold; }
    .subtitle { font-size: 12px; opacity: 0.85; }
    .actions { display: flex; gap: 8px; }
    .btn {
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      transition: background 0.2s;
    }
    .btn-download { background: #10b981; color: white; }
    .btn-download:hover { background: #059669; }
    .viewer-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 65px);
      background: #525659;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="info">
      <div class="title" id="titulo">Comprobante de Egreso</div>
      <div class="subtitle">Supermercado Belalcázar • Fundación Una Mano Amiga</div>
    </div>
    <div class="actions">
      <a id="btnDescargar" class="btn btn-download" href="#" target="_blank" download>📥 Descargar PDF</a>
    </div>
  </div>

  <div class="viewer-container">
    <iframe id="pdfFrame" src="" allowfullscreen></iframe>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pdf = params.get('pdf') || '001-CE-363828.pdf';
    const pdfClean = pdf.endsWith('.pdf') ? pdf : pdf + '.pdf';
    const pdfUrl = 'https://kevinseya17.github.io/belalcazar-monitor/pdfs/' + pdfClean;
    
    document.getElementById('titulo').innerText = 'Comprobante ' + pdfClean.replace('.pdf', '');
    const btn = document.getElementById('btnDescargar');
    btn.href = pdfUrl;
    btn.setAttribute('download', pdfClean);

    // Usar el visor de Google Docs embebido para que abra al 100% en cualquier celular (Android o iPhone) sin importar WhatsApp
    document.getElementById('pdfFrame').src = 'https://docs.google.com/viewer?embedded=true&url=' + encodeURIComponent(pdfUrl);
  </script>
</body>
</html>
